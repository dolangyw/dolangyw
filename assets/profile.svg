<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    width="1400"
    height="760"
    viewBox="0 0 1400 760"
>

<defs>

    <linearGradient
        id="background"
        x1="0"
        y1="0"
        x2="1"
        y2="1"
    >
        <stop offset="0%" stop-color="#020617"/>
        <stop offset="50%" stop-color="#061226"/>
        <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <filter
        id="glow"
        x="-50%"
        y="-50%"
        width="200%"
        height="200%"
    >
        <feGaussianBlur
            stdDeviation="8"
            result="blur"
        />

        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

    <filter
        id="strongGlow"
        x="-100%"
        y="-100%"
        width="300%"
        height="300%"
    >
        <feGaussianBlur
            stdDeviation="18"
            result="blur"
        />

        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

    <pattern
        id="grid"
        width="50"
        height="50"
        patternUnits="userSpaceOnUse"
    >

        <path
            d="M 50 0 L 0 0 0 50"
            fill="none"
            stroke="#0ea5e9"
            stroke-width="1"
            opacity="0.10"
        />

    </pattern>

    <pattern
        id="scanlines"
        width="100%"
        height="10"
        patternUnits="userSpaceOnUse"
    >

        <rect
            width="100%"
            height="2"
            fill="#22d3ee"
            opacity="0.10"
        />

    </pattern>

    <linearGradient
        id="hologram"
        x1="0"
        y1="0"
        x2="1"
        y2="1"
    >

        <stop
            offset="0%"
            stop-color="#67e8f9"
            stop-opacity="0.15"
        />

        <stop
            offset="45%"
            stop-color="#22d3ee"
            stop-opacity="0.45"
        />

        <stop
            offset="100%"
            stop-color="#6366f1"
            stop-opacity="0.10"
        />

    </linearGradient>

    <linearGradient
        id="scan"
        x1="0"
        y1="0"
        x2="1"
        y2="0"
    >

        <stop
            offset="0%"
            stop-color="#22d3ee"
            stop-opacity="0"
        />

        <stop
            offset="40%"
            stop-color="#22d3ee"
            stop-opacity="0.2"
        />

        <stop
            offset="50%"
            stop-color="#ffffff"
            stop-opacity="1"
        />

        <stop
            offset="60%"
            stop-color="#22d3ee"
            stop-opacity="0.2"
        />

        <stop
            offset="100%"
            stop-color="#22d3ee"
            stop-opacity="0"
        />

    </linearGradient>

    <clipPath id="portraitClip">

        <rect
            x="490"
            y="150"
            width="420"
            height="500"
            rx="20"
        />

    </clipPath>

    <mask id="portraitMask">

        <rect
            x="0"
            y="0"
            width="1400"
            height="760"
            fill="black"
        />

        <rect
            x="500"
            y="160"
            width="400"
            height="480"
            rx="20"
            fill="white"
        />

    </mask>

</defs>

<rect
    width="1400"
    height="760"
